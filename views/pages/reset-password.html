<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTélio - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&family=EB+Garamond:wght@400;500;600;700;800&family=Gelasio:wght@400;500;600;700&family=Ibarra+Real+Nova:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Luxurious+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-content">

            <h1 class="login-logo">
               <span class="logo-art">ART</span><span class="logo-elio">élio</span>
            </h1>
            <p class="login-tagline">Choose a New Password</p>

            <p class="login-subtitle">Make it something you haven't used before.</p>

            <div class="login-box">
                <h2 class="login-title">New Password</h2>

                <form class="login-form" id="resetPasswordForm">
                    <div class="password-field">
                        <input
                            type="password"
                            class="login-input"
                            id="password"
                            placeholder="New password"
                            required
                        >
                        <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <input
                        type="password"
                        class="login-input"
                        id="confirm"
                        placeholder="Confirm new password"
                        required
                    >
                    <button type="submit" class="login-button">Set new password</button>
                    <p class="form-error"></p>
                    <p class="form-success"></p>
                </form>
                <p class="signup-text">
                    <a href="/login" class="signup-link">Back to Log In</a>
                </p>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
