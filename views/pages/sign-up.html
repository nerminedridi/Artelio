<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTélio - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;800&family=EB+Garamond:wght@400;500&family=Gelasio:wght@400;500;600;700&family=Ibarra+Real+Nova:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Luxurious+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sign-up.css">
</head>
<body>

    <header class="signup-header">
        <h1 class="signup-logo">
            <span class="logo-art">ART</span><span class="logo-elio">élio</span>
        </h1>
        <p class="signup-tagline">Create your account</p>
        <p class="signup-subtitle">Join the world of digital exhibitions and artists.</p>
    </header>

    <main class="signup-main">

        <div class="signup-left">
            <h2 class="join-title">Join us as:</h2>

            <div class="role-cards">

                <label class="role-card" id="card-visitor">
                    <input type="radio" name="role" value="visitor" class="role-radio" checked>
                    <span class="role-checkbox"></span>
                    <img src="/images/visitor-logo.png" alt="Visitor" class="role-img-visitor">
                    <div class="role-info">
                        <span class="role-name">Visitor</span>
                        <span class="role-desc">Discover and immerse yourself in curated virtual exhibitions from around the world. Save your favourite artworks, follow artists, and build your own personal gallery of inspiration.</span>
                    </div>
                </label>

                <label class="role-card" id="card-curator">
                    <input type="radio" name="role" value="curator" class="role-radio">
                    <span class="role-checkbox"></span>
                    <img src="/images/curator-logo.png" alt="Curator" class="role-img-curator">
                    <div class="role-info">
                        <span class="role-name">Curator</span>
                        <span class="role-desc">Design and manage professional virtual showrooms. Craft thematic exhibitions, collaborate with artists, and bring unique curatorial visions to life in the digital space.</span>
                    </div>
                </label>

                <label class="role-card" id="card-artist">
                    <input type="radio" name="role" value="artist" class="role-radio">
                    <span class="role-checkbox"></span>
                    <img src="/images/artist-logo.png" alt="Artist" class="role-img-artist">
                    <div class="role-info">
                        <span class="role-name">Artist</span>
                        <span class="role-desc">Showcase your work to a global audience. Upload and manage your portfolio, connect with curators and collectors, and gain the visibility your art deserves on a dedicated creative platform.</span>
                    </div>
                </label>

            </div>
        </div>

        <div class="signup-divider"></div>

        <div class="signup-right">
            <form class="signup-form" id="signupForm">

                <div class="form-group">
                    <label class="form-label">Full Name:</label>
                    <input type="text" id="fullname" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address:</label>
                    <input type="email" id="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password:</label>
                    <input type="password" id="password" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password:</label>
                    <input type="password" id="confirm" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Bio:</label>
                    <textarea id="bio" class="form-textarea"></textarea>
                </div>

                <div class="role-fields artist-fields" id="artistFields">

                    <div class="role-fields-header">
                        <span class="role-fields-tag">Artist Profile</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Portfolio URL:</label>
                        <input type="url" id="portfolioUrl" class="form-input" placeholder="https://yourportfolio.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Art Medium / Style:</label>
                        <input type="text" id="artMedium" class="form-input" placeholder="e.g. Oil painting, Digital art, Sculpture…">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Years Active:</label>
                        <input type="number" id="yearsActive" class="form-input" placeholder="e.g. 8" min="0" max="80">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Upload Portfolio Samples <span class="form-label-note">(up to 5 images)</span>:</label>
                        <label class="file-upload-label" id="portfolioFileLabel">
                            <i class="bi bi-cloud-upload"></i>
                            <span id="portfolioFileName">Click to upload or drag &amp; drop</span>
                            <input type="file" id="portfolioFiles" class="file-input" accept="image/*" multiple>
                        </label>
                    </div>

                </div>
                <div class="role-fields curator-fields" id="curatorFields">

                    <div class="role-fields-header">
                        <span class="role-fields-tag">Curator Profile</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Institution / Gallery Name:</label>
                        <input type="text" id="institution" class="form-input" placeholder="e.g. Tate Modern, Independent">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Institution Website:</label>
                        <input type="url" id="institutionUrl" class="form-input" placeholder="https://yourinstitution.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Past Exhibitions / Curation Experience:</label>
                        <textarea id="pastExhibitions" class="form-textarea form-textarea-tall" placeholder="Briefly describe exhibitions you have organised, themes you have explored, or notable collaborations…"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Preferred Curation Themes:</label>
                        <input type="text" id="curationThemes" class="form-input" placeholder="e.g. Contemporary abstraction, Photography, Surrealism…">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Upload CV / Portfolio <span class="form-label-note">(PDF or DOC)</span>:</label>
                        <label class="file-upload-label" id="cvFileLabel">
                            <i class="bi bi-file-earmark-arrow-up"></i>
                            <span id="cvFileName">Click to upload your CV</span>
                            <input type="file" id="cvFile" class="file-input" accept=".pdf,.doc,.docx">
                        </label>
                    </div>

                </div>

                <div class="form-group terms-group">
                    <label class="terms-label">
                        <input type="checkbox" id="termsCheck" class="terms-checkbox" required>
                        <span class="terms-custom-checkbox"></span>
                        <span class="terms-text">
                            I have read and agree to the
                            <a href="help.html" target="_blank" class="terms-link">Terms &amp; Conditions and Privacy Policy</a>.
                        </span>
                    </label>
                    <p class="terms-hint">You must accept our policies before creating an account.</p>
                </div>

                <div class="form-submit">
                    <button type="submit" class="signup-btn">Sign up</button>
                </div>

            </form>
        </div>

    </main>

    <script src="/js/main.js"></script>
    <script>
        const radios = document.querySelectorAll('.role-radio');
        const artistFields = document.getElementById('artistFields');
        const curatorFields = document.getElementById('curatorFields');

        function updateForm(role) {
            artistFields.classList.remove('visible');
            curatorFields.classList.remove('visible');

            artistFields.querySelectorAll('input, textarea').forEach(el => el.disabled = true);
            curatorFields.querySelectorAll('input, textarea').forEach(el => el.disabled = true);

            if (role === 'artist') {
                artistFields.classList.add('visible');
                artistFields.querySelectorAll('input, textarea').forEach(el => el.disabled = false);
            } else if (role === 'curator') {
                curatorFields.classList.add('visible');
                curatorFields.querySelectorAll('input, textarea').forEach(el => el.disabled = false);
            }
        }

        radios.forEach(radio => {
            radio.addEventListener('change', () => updateForm(radio.value));
        });

        updateForm('visitor');

        document.getElementById('portfolioFiles').addEventListener('change', function () {
            const count = this.files.length;
            document.getElementById('portfolioFileName').textContent =
                count === 0 ? 'Click to upload or drag & drop'
                : count === 1 ? this.files[0].name
                : `${count} files selected`;
        });
        document.getElementById('cvFile').addEventListener('change', function () {
            document.getElementById('cvFileName').textContent =
                this.files.length ? this.files[0].name : 'Click to upload your CV';
        });
    </script>

</body>
</html>
