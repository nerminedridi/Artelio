<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTélio - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&family=EB+Garamond:wght@400;500;600;700;800&family=Gelasio:wght@400;500;600;700&family=Ibarra+Real+Nova:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Luxurious+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-content">
            
            <h1 class="login-logo">
               <span class="logo-art">ART</span><span class="logo-elio">élio</span>
            </h1>
            <p class="login-tagline">Discover Our Creative World</p>

            <p class="login-subtitle">Explore unique artworks from creators around the world.</p>

            <div class="login-box">
                <h2 class="login-title">Log In</h2>

                <form class="login-form" id="loginForm">
                    <input 
                        type="text" 
                        class="login-input" 
                        id="email" 
                        placeholder="Username or Email address" 
                        required
                    >
                    <div class="password-field">
                        <input
                            type="password"
                            class="login-input"
                            id="password"
                            placeholder="Password"
                            required
                        >
                        <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="forgot-password-container">
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    <button type="submit" class="login-button">Enter gallery</button>
                </form>
                <div class="remember-me-container">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        class="remember-checkbox"
                    >
                    <label for="remember" class="remember-label">Always remember me</label>
                </div>
                <p class="signup-text">
                    Don't have an account? 
                    <a href="/sign-up" class="signup-link">Sign Up</a>
                </p>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
