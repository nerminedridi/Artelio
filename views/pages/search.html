<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTélio - Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&family=EB+Garamond:wght@400;500&family=Gelasio:wght@400;500;600;700&family=Ibarra+Real+Nova:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Luxurious+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/search.css">
</head>
<body>
    <header class="search-header">
        <h1 class="search-logo">
            <span class="logo-name">ARTélio</span>
        </h1>
        <button class="close-btn" data-back>
            <span>&#x2715;</span> Close
        </button>
    </header>

    <main class="search-main">
        <h2 class="search-title">Looking for something ?</h2>

        <div class="search-bar-wrapper">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search for art, artist, or curator..."
                autofocus
            >
            <button class="filter-btn" id="filterBtn" title="Filter">
                <i class="bi bi-filter-right"></i>
            </button>
        </div>

        <div class="filter-dropdown" id="filterDropdown">
            <button class="filter-option active" data-filter="all">All</button>
            <button class="filter-option" data-filter="abstract">Abstract</button>
            <button class="filter-option" data-filter="contemporary">Contemporary</button>
            <button class="filter-option" data-filter="digital">Digital</button>
            <button class="filter-option" data-filter="photography">Photography</button>
        </div>

        <button class="search-btn" id="searchBtn">Search</button>

        <div class="search-results" id="searchResults"></div>
    </main>

    <script src="/js/main.js"></script>
    <script>
      (function () {
        document.getElementById('filterBtn').addEventListener('click', () => {
            const dd = document.getElementById('filterDropdown');
            dd.classList.toggle('open');
        });

        let currentFilter = 'all';

        function setFilter(category, btn) {
            document.querySelectorAll('.filter-option').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = category;
            const dd = document.getElementById('filterDropdown');
            dd.classList.remove('open');
        }
        function doSearch() {
            const term = document.getElementById('searchInput').value.trim();
            if (!term) return;
            window.location.href = `/search-results.html?q=${encodeURIComponent(term)}&filter=${currentFilter}`;
        }

        document.querySelectorAll('.filter-option').forEach((btn) => {
            btn.addEventListener('click', () => setFilter(btn.dataset.filter, btn));
        });
        document.getElementById('searchBtn').addEventListener('click', doSearch);

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        document.addEventListener('click', (e) => {
            const dd = document.getElementById('filterDropdown');
            const btn = document.getElementById('filterBtn');
            if (!dd.contains(e.target) && !btn.contains(e.target)) {
                dd.classList.remove('open');
            }
        });
      })();
    </script>
</body>
</html>
