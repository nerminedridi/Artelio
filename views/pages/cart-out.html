<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARTélio — Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/cart-out.css" />
</head>
<body>

  <header class="site-header">
    <a href="/" class="logo">ARTélio</a>
    <a href="/" class="close-btn">
      <span>× Close</span>
      <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
    </a>
  </header>
  <main class="main-content">
    <div class="guest-card">

      <h1 class="cart-title"><em>Cart</em></h1>
      <p class="cart-subtitle"><em>Your cart is waiting!!</em></p>

      <div class="cart-illustration">
        <img src="images/cartout-bg.png" alt="Cart illustration" class="cart-img"/>
      </div>

      <p class="guest-message">
        log in to your account or create one to save and<br>
        purchase mesmerizing artworks and create your<br>
        own collection.
      </p>

      <div class="auth-buttons">
        <a href="/sign-up" class="btn-signup">Sign up</a>
        <span class="btn-or">Or</span>
        <a href="/login" class="btn-login">Log in</a>
      </div>

      <p class="tagline">Every collection begins with a single piece.</p>

    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 ARTélio. All rights reserved.</p>
  </footer>

</body>
</html>
